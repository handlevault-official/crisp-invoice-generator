<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Create, calculate, save, and print professional invoices locally in your browser." />
  <title>Invoice Studio — Modern &amp; Professional</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2225%22 fill=%22%23b9a8ff%22/><text y=%22.9em%22 font-size=%2260%22 x=%2218%22>✦</text></svg>">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2225%22 fill=%22%23b9a8ff%22/><text y=%22.9em%22 font-size=%2260%22 x=%2218%22>✦</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-canvas: #f1f5f9;
      --surface: #ffffff;
      --primary: #0f172a;
      --accent: #4f46e5;
      --accent-hover: #4338ca;
      --kofi-color: #ff5e5b;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --border: #cbd5e1;
      --border-light: #e2e8f0;
      --radius: 10px;
      --shadow: 0 10px 30px -5px rgba(15, 23, 42, 0.08);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px 12px;
      min-height: 100vh;
      background: var(--bg-canvas);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    }
    button, input, select, textarea { font: inherit; }
    .invoice-container {
      max-width: 900px;
      margin: 0 auto;
      padding: 32px 24px;
      background: var(--surface);
      border: 1px solid var(--border-light);
      border-radius: 16px;
      box-shadow: var(--shadow);
    }
    .top-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 24px;
      padding-bottom: 20px;
      border-bottom: 2px solid var(--primary);
    }
    .brand-title h1 { margin: 0; color: var(--primary); font-size: 24px; font-weight: 800; letter-spacing: -0.5px; }
    .brand-title p { margin: 2px 0 0; color: var(--text-muted); font-size: 12px; }
    .currency-field { width: 160px; }
    .meta-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    .field-group { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
    label {
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }
    input, select, textarea {
      width: 100%;
      padding: 10px 14px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      outline: none;
      background: #fafafa;
      color: var(--text-main);
      font-size: 14px;
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
    }
    input:focus, select:focus, textarea:focus {
      border-color: var(--accent);
      background: #fff;
      box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
    }
    textarea { resize: vertical; }
    .parties-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 28px;
      padding: 20px;
      border: 1px solid var(--border-light);
      border-radius: 12px;
      background: #f8fafc;
    }
    .table-responsive { width: 100%; overflow-x: auto; margin-bottom: 20px; }
    table { width: 100%; min-width: 570px; border-collapse: collapse; }
    th {
      padding: 12px 8px;
      border-bottom: 2px solid var(--border);
      background: #f1f5f9;
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-align: left;
      text-transform: uppercase;
    }
    th:first-child { border-radius: 8px 0 0 8px; }
    th:last-child { border-radius: 0 8px 8px 0; }
    td { padding: 10px 8px; border-bottom: 1px solid var(--border-light); }
    .table-input { padding: 8px; border: 1px solid var(--border-light); border-radius: 6px; background: transparent; }
    .table-input:hover, .table-input:focus { background: #fff; }
    .table-input:focus { border-color: var(--accent); box-shadow: none; }
    .amount-cell { padding-left: 10px; font-weight: 600; white-space: nowrap; }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 20px;
      border: 0;
      border-radius: var(--radius);
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      transition: background 0.2s, transform 0.1s;
    }
    .btn:hover { background: var(--accent-hover); }
    .btn:active { transform: scale(0.98); }
    .btn-secondary { border: 1.5px solid var(--border); background: #fff; color: var(--text-main); }
    .btn-secondary:hover { background: #f1f5f9; }
    .btn-kofi { background: var(--kofi-color); }
    .btn-kofi:hover { background: #e04845; }
    .btn-danger { padding: 8px 12px; border: 0; border-radius: 6px; background: #fee2e2; color: #dc2626; cursor: pointer; }
    .btn-danger:hover { background: #fca5a5; }
    .bottom-section { display: grid; grid-template-columns: 1fr 300px; gap: 24px; margin-top: 28px; align-items: start; }
    .totals-box {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 20px;
      border: 1px solid var(--border-light);
      border-radius: 12px;
      background: #f8fafc;
    }
    .totals-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; color: var(--text-muted); font-size: 14px; }
    .totals-row input { width: 84px; padding: 6px 8px; text-align: right; }
    .totals-row.grand { padding-top: 12px; border-top: 2px solid var(--border-light); color: var(--primary); font-size: 18px; font-weight: 700; }
    .tax-type-selector { padding-top: 10px; border-top: 1px solid var(--border-light); }
    .tax-type-selector label { display: block; margin-bottom: 6px; }
    .tax-type-selector input { margin-top: 8px; }
    .actions-bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 32px; padding-top: 20px; border-top: 1px solid var(--border-light); }
    .action-buttons-group { display: flex; gap: 10px; flex-wrap: wrap; }
    @media (max-width: 768px) {
      .invoice-container { padding: 16px 12px; }
      .parties-grid, .bottom-section { grid-template-columns: 1fr; gap: 16px; }
      .totals-box { width: 100%; }
      .actions-bar { flex-direction: column; align-items: stretch; }
      .action-buttons-group { flex-direction: column; width: 100%; }
      .actions-bar a, .actions-bar button { width: 100%; }
    }
    @media print {
      @page { margin: 12mm; }
      body { padding: 0; background: #fff; }
      .invoice-container { max-width: 100%; padding: 0; border: 0; border-radius: 0; box-shadow: none; }
      .no-print { display: none !important; }
      input, textarea, select { padding: 0 !important; border: 0 !important; background: transparent !important; box-shadow: none !important; color: #111 !important; }
      .table-input { border: 0 !important; }
      .totals-box, .parties-grid { border: 1px solid #ddd; background: transparent; }
      th { background: #eee !important; color: #000 !important; }
      .table-responsive { overflow: visible; }
      table { min-width: 0; }
    }
  </style>
</head>
<body>
  <main class="invoice-container">
    <header class="top-header">
      <div class="brand-title">
        <h1>INVOICE</h1>
        <p>Professional Billing &amp; Statement</p>
      </div>
      <div class="field-group currency-field no-print">
        <label for="currency">Currency</label>
        <select id="currency" aria-label="Invoice currency">
          <option value="USD">USD ($)</option>
          <option value="EUR">EUR (€)</option>
          <option value="GBP">GBP (£)</option>
          <option value="AUD">AUD ($)</option>
          <option value="CAD">CAD ($)</option>
          <option value="SGD">SGD ($)</option>
          <option value="PHP" selected>PHP (₱)</option>
        </select>
      </div>
    </header>

    <section class="meta-grid" aria-label="Invoice details">
      <div class="field-group">
        <label for="invoiceNumber">Invoice Number</label>
        <input type="text" id="invoiceNumber" value="INV-2026-001" autocomplete="off" />
      </div>
      <div class="field-group">
        <label for="issueDate">Issue Date</label>
        <input type="date" id="issueDate" />
      </div>
      <div class="field-group">
        <label for="dueDate">Due Date</label>
        <input type="date" id="dueDate" />
      </div>
    </section>

    <section class="parties-grid" aria-label="Invoice parties">
      <div class="field-group">
        <label for="fromInfo">Billed From</label>
        <textarea id="fromInfo" rows="4" placeholder="Your Business Name&#10;Address Line, City&#10;Email / Contact Number"></textarea>
      </div>
      <div class="field-group">
        <label for="toInfo">Billed To</label>
        <textarea id="toInfo" rows="4" placeholder="Client Company / Name&#10;Client Address&#10;Client Email"></textarea>
      </div>
    </section>

    <div class="table-responsive">
      <table>
        <thead>
          <tr>
            <th scope="col">Description of Items / Services</th>
            <th scope="col" style="width: 90px;">Qty</th>
            <th scope="col" style="width: 140px;">Price</th>
            <th scope="col" style="width: 140px;">Amount</th>
            <th scope="col" class="no-print" style="width: 50px; text-align: center;"><span class="visually-hidden">Actions</span></th>
          </tr>
        </thead>
        <tbody id="itemsBody"></tbody>
      </table>
    </div>
    <button class="btn btn-secondary no-print" id="addItemButton" type="button">+ Add Line Item</button>

    <section class="bottom-section" aria-label="Invoice summary">
      <div class="field-group">
        <label for="notes">Notes &amp; Payment Instructions</label>
        <textarea id="notes" rows="4" placeholder="e.g. Bank Transfer: GCash / BPI&#10;Account Name: Your Name&#10;Account Number: XXXX-XXXX"></textarea>
      </div>

      <div class="totals-box">
        <div class="totals-row">
          <span>Subtotal</span>
          <span id="subtotalDisplay">₱0.00</span>
        </div>
        <div class="totals-row">
          <label for="discountRate">Discount (%)</label>
          <input type="number" id="discountRate" value="0" min="0" max="100" step="0.01" inputmode="decimal" />
        </div>
        <div class="totals-row">
          <span>Discount Amount</span>
          <span id="discountDisplay">₱0.00</span>
        </div>
        <div class="totals-row">
          <label id="taxRateLabel" for="taxRate">VAT Rate (%)</label>
          <input type="number" id="taxRate" value="12" min="0" step="0.01" inputmode="decimal" />
        </div>
        <div class="totals-row">
          <span id="taxAmountLabel">VAT Amount</span>
          <span id="taxDisplay">₱0.00</span>
        </div>
        <div class="totals-row grand">
          <span>Total Due</span>
          <span id="totalDisplay">₱0.00</span>
        </div>
        <div class="tax-type-selector no-print">
          <label for="taxTypeSelect">Tax Label Mode</label>
          <select id="taxTypeSelect">
            <option value="VAT">VAT (Value-Added Tax)</option>
            <option value="Tax">Sales Tax</option>
            <option value="CUSTOM">Custom Label</option>
          </select>
          <input type="text" id="customTaxLabelInput" placeholder="Enter custom label" maxlength="30" hidden />
        </div>
      </div>
    </section>

    <footer class="actions-bar no-print">
      <a href="https://ko-fi.com/handlevault" target="_blank" rel="noopener noreferrer" class="btn btn-kofi">☕ Support on Ko-fi</a>
      <div class="action-buttons-group">
        <button class="btn btn-secondary" id="loadDraftButton" type="button">Load Draft</button>
        <button class="btn btn-secondary" id="saveDraftButton" type="button">Save Draft</button>
        <button class="btn" id="printButton" type="button">Print / Export PDF</button>
      </div>
    </footer>
  </main>


  <!-- Main Invoice Logic -->
  <script>
    const DRAFT_KEY = 'invoice_pro_v2';
    const DEFAULT_ITEMS = [{ description: 'Professional Services / Consulting', qty: 1, price: 12500 }];
    let items = DEFAULT_ITEMS.map((item) => ({ ...item }));

    const byId = (id) => document.getElementById(id);
    const clampPercent = (value) => Math.min(100, Math.max(0, Number.parseFloat(value) || 0));

    function formatMoney(amount) {
      const currency = byId('currency').value;
      try {
        return new Intl.NumberFormat(undefined, {
          style: 'currency',
          currency,
          minimumFractionDigits: 2,
          maximumFractionDigits: 2
        }).format(Number.isFinite(amount) ? amount : 0);
      } catch {
        return `${currency} ${(Number.isFinite(amount) ? amount : 0).toFixed(2)}`;
      }
    }

    function renderItems() {
      const tbody = byId('itemsBody');
      tbody.replaceChildren();

      items.forEach((item, index) => {
        const row = document.createElement('tr');
        const descriptionCell = document.createElement('td');
        const descriptionInput = document.createElement('input');
        descriptionInput.type = 'text';
        descriptionInput.className = 'table-input';
        descriptionInput.value = item.description ?? '';
        descriptionInput.setAttribute('aria-label', `Item ${index + 1} description`);
        descriptionInput.addEventListener('input', (event) => { items[index].description = event.target.value; });
        descriptionCell.append(descriptionInput);
        row.append(descriptionCell);

        const quantityCell = document.createElement('td');
        const quantityInput = document.createElement('input');
        quantityInput.type = 'number';
        quantityInput.className = 'table-input';
        quantityInput.min = '0';
        quantityInput.step = 'any';
        quantityInput.inputMode = 'decimal';
        quantityInput.value = item.qty ?? 1;
        quantityInput.setAttribute('aria-label', `Item ${index + 1} quantity`);
        quantityInput.addEventListener('input', (event) => {
          items[index].qty = Math.max(0, Number.parseFloat(event.target.value) || 0);
          updateRowAmount(index, amountCell);
          calculateTotals();
        });
        quantityCell.append(quantityInput);
        row.append(quantityCell);

        const priceCell = document.createElement('td');
        const priceInput = document.createElement('input');
        priceInput.type = 'number';
        priceInput.className = 'table-input';
        priceInput.min = '0';
        priceInput.step = 'any';
        priceInput.inputMode = 'decimal';
        priceInput.value = item.price ?? 0;
        priceInput.setAttribute('aria-label', `Item ${index + 1} unit price`);
        priceInput.addEventListener('input', (event) => {
          items[index].price = Math.max(0, Number.parseFloat(event.target.value) || 0);
          updateRowAmount(index, amountCell);
          calculateTotals();
        });
        priceCell.append(priceInput);
        row.append(priceCell);

        const amountCell = document.createElement('td');
        amountCell.className = 'amount-cell';
        updateRowAmount(index, amountCell);
        row.append(amountCell);

        const actionCell = document.createElement('td');
        actionCell.className = 'no-print';
        actionCell.style.textAlign = 'center';
        const deleteButton = document.createElement('button');
        deleteButton.type = 'button';
        deleteButton.className = 'btn-danger';
        deleteButton.textContent = '×';
        deleteButton.setAttribute('aria-label', `Remove item ${index + 1}`);
        deleteButton.addEventListener('click', () => {
          items.splice(index, 1);
          renderItems();
        });
        actionCell.append(deleteButton);
        row.append(actionCell);
        tbody.append(row);
      });
      calculateTotals();
    }

    function updateRowAmount(index, cell) {
      const item = items[index];
      cell.textContent = formatMoney((Number(item.qty) || 0) * (Number(item.price) || 0));
    }

    function calculateTotals() {
      const subtotal = items.reduce((sum, item) => {
        return sum + (Math.max(0, Number(item.qty) || 0) * Math.max(0, Number(item.price) || 0));
      }, 0);
      const discountRate = clampPercent(byId('discountRate').value);
      const discountAmount = subtotal * discountRate / 100;
      const taxableSubtotal = Math.max(0, subtotal - discountAmount);
      const taxRate = Math.max(0, Number.parseFloat(byId('taxRate').value) || 0);
      const taxAmount = taxableSubtotal * taxRate / 100;
      const total = taxableSubtotal + taxAmount;

      byId('subtotalDisplay').textContent = formatMoney(subtotal);
      byId('discountDisplay').textContent = formatMoney(discountAmount);
      byId('taxDisplay').textContent = formatMoney(taxAmount);
      byId('totalDisplay').textContent = formatMoney(total);
    }

    function updateTaxLabel() {
      const mode = byId('taxTypeSelect').value;
      const customInput = byId('customTaxLabelInput');
      const label = mode === 'CUSTOM' ? (customInput.value.trim() || 'Tax') : mode;
      byId('taxRateLabel').textContent = `${label} Rate (%)`;
      byId('taxAmountLabel').textContent = `${label} Amount`;
      customInput.hidden = mode !== 'CUSTOM';
    }

    function getDraftData() {
      return {
        invoiceNumber: byId('invoiceNumber').value,
        issueDate: byId('issueDate').value,
        dueDate: byId('dueDate').value,
        currency: byId('currency').value,
        fromInfo: byId('fromInfo').value,
        toInfo: byId('toInfo').value,
        notes: byId('notes').value,
        discountRate: byId('discountRate').value,
        taxRate: byId('taxRate').value,
        taxType: byId('taxTypeSelect').value,
        customTaxLabel: byId('customTaxLabelInput').value,
        items
      };
    }

    function saveDraft() {
      try {
        localStorage.setItem(DRAFT_KEY, JSON.stringify(getDraftData()));
        alert('Draft saved successfully in this browser.');
      } catch (error) {
        console.error('Unable to save invoice draft:', error);
        alert('Unable to save the draft. Check your browser storage settings.');
      }
    }

    function loadDraft(showMessage = true) {
      const saved = localStorage.getItem(DRAFT_KEY);
      if (!saved) {
        if (showMessage) alert('No saved draft found in this browser.');
        return false;
      }

      try {
        const data = JSON.parse(saved);
        byId('invoiceNumber').value = data.invoiceNumber ?? 'INV-2026-001';
        byId('issueDate').value = data.issueDate ?? '';
        byId('dueDate').value = data.dueDate ?? '';
        byId('currency').value = data.currency ?? 'PHP';
        byId('fromInfo').value = data.fromInfo ?? '';
        byId('toInfo').value = data.toInfo ?? '';
        byId('notes').value = data.notes ?? '';
        byId('discountRate').value = data.discountRate ?? 0;
        byId('taxRate').value = data.taxRate ?? 12;
        byId('taxTypeSelect').value = data.taxType ?? 'VAT';
        byId('customTaxLabelInput').value = data.customTaxLabel ?? '';
        if (Array.isArray(data.items) && data.items.length > 0) {
          items = data.items.map((item) => ({ ...item }));
        }
        updateTaxLabel();
        renderItems();
        if (showMessage) alert('Draft loaded successfully.');
        return true;
      } catch (error) {
        console.error('Unable to parse saved invoice draft:', error);
        if (showMessage) alert('Unable to load draft. The saved file might be corrupted.');
        return false;
      }
    }

    // Event Listeners
    byId('addItemButton').addEventListener('click', () => {
      items.push({ description: '', qty: 1, price: 0 });
      renderItems();
    });
    byId('currency').addEventListener('change', renderItems);
    byId('discountRate').addEventListener('input', calculateTotals);
    byId('taxRate').addEventListener('input', calculateTotals);
    byId('taxTypeSelect').addEventListener('change', () => {
      updateTaxLabel();
      calculateTotals();
    });
    byId('customTaxLabelInput').addEventListener('input', updateTaxLabel);
    byId('saveDraftButton').addEventListener('click', saveDraft);
    byId('loadDraftButton').addEventListener('click', () => loadDraft(true));
    byId('printButton').addEventListener('click', () => window.print());

    // Initial Setup on Page Load
    updateTaxLabel();
    renderItems();
    loadDraft(false);
});
</script> <!-- Isara muna ang inline script dito -->

<!-- I-link mo dito ang repo.js -->
<script src="repo.js"></script>

</body>
</html>
