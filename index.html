<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Invoice Studio — Modern & Professional</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-canvas: #f1f5f9;
      --surface: #ffffff;
      --primary: #0f172a;
      --accent: #4f46e5;
      --accent-hover: #4338ca;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --border: #cbd5e1;
      --border-light: #e2e8f0;
      --radius: 10px;
      --shadow: 0 10px 30px -5px rgba(15, 23, 42, 0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
    body { background: var(--bg-canvas); color: var(--text-main); padding: 40px 16px; min-height: 100vh; }

    .invoice-container {
      max-width: 900px;
      margin: 0 auto;
      background: var(--surface);
      border-radius: 16px;
      box-shadow: var(--shadow);
      padding: 48px;
      border: 1px solid var(--border-light);
    }

    /* Top Brand & Status */
    .top-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      border-bottom: 2px solid var(--primary);
      padding-bottom: 24px;
      margin-bottom: 32px;
    }

    .brand-title h1 {
      font-size: 28px;
      font-weight: 800;
      color: var(--primary);
      letter-spacing: -0.5px;
    }

    .brand-title p {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* Form Fields Styling */
    .meta-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-bottom: 32px;
    }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-muted);
    }

    input, select, textarea {
      width: 100%;
      padding: 10px 14px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      font-size: 14px;
      color: var(--text-main);
      background: #fafafa;
      outline: none;
      transition: all 0.2s ease;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--accent);
      background: #ffffff;
      box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
    }

    .parties-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      margin-bottom: 36px;
      background: #f8fafc;
      padding: 24px;
      border-radius: 12px;
      border: 1px solid var(--border-light);
    }

    /* Table Styling */
    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 20px;
    }

    th {
      text-align: left;
      padding: 12px 10px;
      background: #f1f5f9;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      border-bottom: 2px solid var(--border);
    }

    th:first-child { border-top-left-radius: 8px; border-bottom-left-radius: 8px; }
    th:last-child { border-top-right-radius: 8px; border-bottom-right-radius: 8px; }

    td {
      padding: 12px 10px;
      border-bottom: 1px solid var(--border-light);
    }

    .table-input {
      background: transparent;
      border: 1px solid transparent;
      padding: 6px 8px;
    }
    .table-input:hover { border-color: var(--border); background: #ffffff; }
    .table-input:focus { border-color: var(--accent); background: #ffffff; box-shadow: none; }

    /* Buttons */
    .btn {
      background: var(--accent);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: var(--radius);
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: background 0.2s, transform 0.1s;
    }
    .btn:hover { background: var(--accent-hover); }
    .btn:active { transform: scale(0.98); }

    .btn-secondary {
      background: #ffffff;
      color: var(--text-main);
      border: 1.5px solid var(--border);
    }
    .btn-secondary:hover { background: #f1f5f9; }

    .btn-danger {
      background: #fee2e2;
      color: #dc2626;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
    }
    .btn-danger:hover { background: #fca5a5; }

    /* Summary & Totals */
    .bottom-section {
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 32px;
      margin-top: 32px;
      align-items: flex-start;
    }

    .totals-box {
      background: #f8fafc;
      padding: 24px;
      border-radius: 12px;
      border: 1px solid var(--border-light);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .totals-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      color: var(--text-muted);
    }

    .totals-row.grand {
      font-size: 18px;
      font-weight: 700;
      color: var(--primary);
      border-top: 2px solid var(--border-light);
      padding-top: 12px;
      margin-top: 4px;
    }

    /* Action bar */
    .actions-bar {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 40px;
      padding-top: 24px;
      border-top: 1px solid var(--border-light);
    }

    @media print {
      body { background: white; padding: 0; }
      .invoice-container { border: none; box-shadow: none; padding: 0; max-width: 100%; }
      .no-print { display: none !important; }
      input, textarea, select { border: none !important; background: transparent !important; padding: 0 !important; box-shadow: none !important; }
      .totals-box, .parties-grid { border: 1px solid #ddd; background: transparent; }
      th { background: #eee !important; color: #000 !important; }
    }
  </style>
</head>
<body>

  <div class="invoice-container">
    <div class="top-header">
      <div class="brand-title">
        <h1>INVOICE</h1>
        <p>Professional Billing & Statement</p>
      </div>
      <div style="width: 140px;" class="field-group">
        <label>Currency</label>
        <select id="currency" onchange="calculateTotals()">
          <option value="₱">PHP (₱)</option>
          <option value="$">USD ($)</option>
          <option value="€">EUR (€)</option>
          <option value="¥">JPY (¥)</option>
        </select>
      </div>
    </div>

    <div class="meta-grid">
      <div class="field-group">
        <label>Invoice Number</label>
        <input type="text" id="invoiceNumber" value="INV-2026-001" />
      </div>
      <div class="field-group">
        <label>Issue Date</label>
        <input type="date" id="issueDate" />
      </div>
      <div class="field-group">
        <label>Due Date</label>
        <input type="date" id="dueDate" />
      </div>
    </div>

    <div class="parties-grid">
      <div class="field-group">
        <label>Billed From</label>
        <textarea id="fromInfo" rows="4" placeholder="Your Business Name&#10;Address Line, City&#10;Email / Contact Number"></textarea>
      </div>
      <div class="field-group">
        <label>Billed To</label>
        <textarea id="toInfo" rows="4" placeholder="Client Company / Name&#10;Client Address&#10;Client Email"></textarea>
      </div>
    </div>

    <table>
      <thead>
        <tr>
          <th>Description of Items / Services</th>
          <th style="width: 90px;">Qty</th>
          <th style="width: 140px;">Price</th>
          <th style="width: 140px;">Amount</th>
          <th class="no-print" style="width: 50px; text-align: center;"></th>
        </tr>
      </thead>
      <tbody id="itemsBody"></tbody>
    </table>

    <button class="btn btn-secondary no-print" onclick="addItem()">+ Add Line Item</button>

    <div class="bottom-section">
      <div class="field-group">
        <label>Notes & Payment Instructions</label>
        <textarea id="notes" rows="4" placeholder="e.g. Bank Transfer: GCash / BPI&#10;Account Name: Your Name&#10;Account Number: XXXX-XXXX"></textarea>
      </div>

      <div class="totals-box">
        <div class="totals-row">
          <span>Subtotal</span>
          <span id="subtotalDisplay">₱0.00</span>
        </div>
        <div class="totals-row">
          <span>Tax Rate (%)</span>
          <input type="number" id="taxRate" value="12" style="width: 70px; text-align: right;" oninput="calculateTotals()" />
        </div>
        <div class="totals-row">
          <span>Tax Amount</span>
          <span id="taxDisplay">₱0.00</span>
        </div>
        <div class="totals-row grand">
          <span>Total Due</span>
          <span id="totalDisplay">₱0.00</span>
        </div>
      </div>
    </div>

    <div class="actions-bar no-print">
      <button class="btn btn-secondary" onclick="saveDraft()">Save Draft</button>
      <button class="btn" onclick="window.print()">Print / Export PDF</button>
    </div>
  </div>

  <script>
    let items = [
      { description: "UI/UX Design & Frontend Development", qty: 1, price: 12500 }
    ];

    function renderItems() {
      const tbody = document.getElementById('itemsBody');
      tbody.innerHTML = '';
      items.forEach((item, idx) => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td><input type="text" class="table-input" value="${item.description}" oninput="updateItem(${idx}, 'description', this.value)" /></td>
          <td><input type="number" class="table-input" value="${item.qty}" min="1" oninput="updateItem(${idx}, 'qty', parseFloat(this.value)|0)" /></td>
          <td><input type="number" class="table-input" value="${item.price}" min="0" oninput="updateItem(${idx}, 'price', parseFloat(this.value)|0)" /></td>
          <td style="font-weight: 600; padding-left: 10px;">${document.getElementById('currency').value}${(item.qty * item.price).toFixed(2)}</td>
          <td class="no-print" style="text-align: center;"><button class="btn btn-danger" onclick="removeItem(${idx})">✕</button></td>
        `;
        tbody.appendChild(row);
      });
      calculateTotals();
    }

    function addItem() {
      items.push({ description: "", qty: 1, price: 0 });
      renderItems();
    }

    function removeItem(idx) {
      items.splice(idx, 1);
      renderItems();
    }

    function updateItem(idx, field, val) {
      items[idx][field] = val;
      calculateTotals();
    }

    function calculateTotals() {
      const curr = document.getElementById('currency').value;
      const subtotal = items.reduce((sum, item) => sum + (item.qty * item.price || 0), 0);
      const taxRate = parseFloat(document.getElementById('taxRate').value) || 0;
      const tax = subtotal * (taxRate / 100);
      const total = subtotal + tax;

      document.getElementById('subtotalDisplay').innerText = `${curr}${subtotal.toFixed(2)}`;
      document.getElementById('taxDisplay').innerText = `${curr}${tax.toFixed(2)}`;
      document.getElementById('totalDisplay').innerText = `${curr}${total.toFixed(2)}`;
    }

    function saveDraft() {
      const data = {
        invoiceNumber: document.getElementById('invoiceNumber').value,
        issueDate: document.getElementById('issueDate').value,
        dueDate: document.getElementById('dueDate').value,
        currency: document.getElementById('currency').value,
        fromInfo: document.getElementById('fromInfo').value,
        toInfo: document.getElementById('toInfo').value,
        notes: document.getElementById('notes').value,
        taxRate: document.getElementById('taxRate').value,
        items: items
      };
      localStorage.setItem('invoice_pro_v2', JSON.stringify(data));
      alert('Draft saved successfully to browser storage!');
    }

    function loadDraft() {
      const saved = localStorage.getItem('invoice_pro_v2');
      if (saved) {
        const data = JSON.parse(saved);
        document.getElementById('invoiceNumber').value = data.invoiceNumber || 'INV-2026-001';
        document.getElementById('issueDate').value = data.issueDate || '';
        document.getElementById('dueDate').value = data.dueDate || '';
        document.getElementById('currency').value = data.currency || '₱';
        document.getElementById('fromInfo').value = data.fromInfo || '';
        document.getElementById('toInfo').value = data.toInfo || '';
        document.getElementById('notes').value = data.notes || '';
        document.getElementById('taxRate').value = data.taxRate || 12;
        if (data.items && data.items.length) items = data.items;
      } else {
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('issueDate').value = today;
      }
    }

    window.onload = () => {
      loadDraft();
      renderItems();
    };
  </script>
</body>
</html>
