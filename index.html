<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Invoice Studio — Modern & Professional</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-canvas: #f1f5f9;
      --surface: #ffffff;
      --primary: #0f172a;
      --accent: #4f46e5;
      --accent-hover: #4338ca;
      --kofi-color: #ff5e5b;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --border: #cbd5e1;
      --border-light: #e2e8f0;
      --radius: 10px;
      --shadow: 0 10px 30px -5px rgba(15, 23, 42, 0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
    body { background: var(--bg-canvas); color: var(--text-main); padding: 20px 12px; min-height: 100vh; }

    .invoice-container {
      max-width: 900px;
      margin: 0 auto;
      background: var(--surface);
      border-radius: 16px;
      box-shadow: var(--shadow);
      padding: 32px 24px;
      border: 1px solid var(--border-light);
    }

    .top-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      border-bottom: 2px solid var(--primary);
      padding-bottom: 20px;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 16px;
    }

    .brand-title h1 {
      font-size: 24px;
      font-weight: 800;
      color: var(--primary);
      letter-spacing: -0.5px;
    }

    .brand-title p {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .meta-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-muted);
    }

    input, select, textarea {
      width: 100%;
      padding: 10px 14px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      font-size: 14px;
      color: var(--text-main);
      background: #fafafa;
      outline: none;
      transition: all 0.2s ease;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--accent);
      background: #ffffff;
      box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
    }

    .parties-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 28px;
      background: #f8fafc;
      padding: 20px;
      border-radius: 12px;
      border: 1px solid var(--border-light);
    }

    .table-responsive {
      width: 100%;
      overflow-x: auto;
      margin-bottom: 20px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 550px;
    }

    th {
      text-align: left;
      padding: 12px 8px;
      background: #f1f5f9;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      border-bottom: 2px solid var(--border);
    }

    th:first-child { border-top-left-radius: 8px; border-bottom-left-radius: 8px; }
    th:last-child { border-top-right-radius: 8px; border-bottom-right-radius: 8px; }

    td {
      padding: 10px 8px;
      border-bottom: 1px solid var(--border-light);
    }

    .table-input {
      background: transparent;
      border: 1px solid var(--border-light);
      padding: 8px;
      width: 100%;
      border-radius: 6px;
    }
    .table-input:hover { border-color: var(--border); background: #ffffff; }
    .table-input:focus { border-color: var(--accent); background: #ffffff; box-shadow: none; }

    .btn {
      background: var(--accent);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: var(--radius);
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.2s, transform 0.1s;
      text-decoration: none;
    }
    .btn:hover { background: var(--accent-hover); }
    .btn:active { transform: scale(0.98); }

    .btn-secondary {
      background: #ffffff;
      color: var(--text-main);
      border: 1.5px solid var(--border);
    }
    .btn-secondary:hover { background: #f1f5f9; }

    .btn-kofi {
      background: var(--kofi-color);
      color: white;
    }
    .btn-kofi:hover { background: #e04845; }

    .btn-danger {
      background: #fee2e2;
      color: #dc2626;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
    }
    .btn-danger:hover { background: #fca5a5; }

    .bottom-section {
      display: grid;
      grid-template-columns: 1fr 300px;
      gap: 24px;
      margin-top: 28px;
      align-items: flex-start;
    }

    .totals-box {
      background: #f8fafc;
      padding: 20px;
      border-radius: 12px;
      border: 1px solid var(--border-light);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .totals-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      color: var(--text-muted);
    }

    .totals-row.grand {
      font-size: 18px;
      font-weight: 700;
      color: var(--primary);
      border-top: 2px solid var(--border-light);
      padding-top: 12px;
      margin-top: 4px;
    }

    .actions-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 32px;
      padding-top: 20px;
      border-top: 1px solid var(--border-light);
      flex-wrap: wrap;
      gap: 12px;
    }

    .action-buttons-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    @media (max-width: 768px) {
      .invoice-container { padding: 16px 12px; }
      .parties-grid { grid-template-columns: 1fr; gap: 16px; }
      .bottom-section { grid-template-columns: 1fr; gap: 20px; }
      .totals-box { width: 100%; }
      .actions-bar { flex-direction: column; align-items: stretch; }
      .action-buttons-group { flex-direction: column; width: 100%; }
      .actions-bar a, .actions-bar button { width: 100%; }
    }

    @media print {
      body { background: white; padding: 0; }
      .invoice-container { border: none; box-shadow: none; padding: 0; max-width: 100%; }
      .no-print { display: none !important; }
      input, textarea, select { border: none !important; background: transparent !important; padding: 0 !important; box-shadow: none !important; }
      .totals-box, .parties-grid { border: 1px solid #ddd; background: transparent; }
      th { background: #eee !important; color: #000 !important; }
    }
  </style>
</head>
<body>

  <div class="invoice-container">
    <div class="top-header">
      <div class="brand-title">
        <h1>INVOICE</h1>
        <p>Professional Billing & Statement</p>
      </div>
      <div style="width: 140px;" class="field-group">
        <label>Currency</label>
        <select id="currency" onchange="calculateTotals(); renderItems();">
            <option value="$">USD ($)</option>
            <option value="€">EUR (€)</option>
            <option value="£">GBP (£)</option>
            <option value="AUD $">AUD ($)</option>
            <option value="CAD $">CAD ($)</option>
            <option value="SGD $">SGD ($)</option>
            <option value="₱" selected>PHP (₱)</option>
        </select>
      </div>
    </div>

    <div class="meta-grid">
      <div class="field-group">
        <label>Invoice Number</label>
        <input type="text" id="invoiceNumber" value="INV-2026-001" />
      </div>
      <div class="field-group">
        <label>Issue Date</label>
        <input type="date" id="issueDate" />
      </div>
      <div class="field-group">
        <label>Due Date</label>
        <input type="date" id="dueDate" />
      </div>
    </div>

    <div class="parties-grid">
      <div class="field-group">
        <label>Billed From</label>
        <textarea id="fromInfo" rows="4" placeholder="Your Business Name&#10;Address Line, City&#10;Email / Contact Number"></textarea>
      </div>
      <div class="field-group">
        <label>Billed To</label>
        <textarea id="toInfo" rows="4" placeholder="Client Company / Name&#10;Client Address&#10;Client Email"></textarea>
      </div>
    </div>

    <div class="table-responsive">
      <table>
        <thead>
          <tr>
            <th>Description of Items / Services</th>
            <th style="width: 90px;">Qty</th>
            <th style="width: 140px;">Price</th>
            <th style="width: 140px;">Amount</th>
            <th class="no-print" style="width: 50px; text-align: center;"></th>
          </tr>
        </thead>
        <tbody id="itemsBody"></tbody>
      </table>
    </div>

    <button class="btn btn-secondary no-print" onclick="addItem()">+ Add Line Item</button>

    <div class="bottom-section">
      <div class="field-group">
        <label>Notes & Payment Instructions</label>
        <textarea id="notes" rows="4" placeholder="e.g. Bank Transfer: GCash / BPI&#10;Account Name: Your Name&#10;Account Number: XXXX-XXXX"></textarea>
      </div>

      <div class="totals-box">
        <div class="totals-row">
          <span>Subtotal</span>
          <span id="subtotalDisplay">₱0.00</span>
        </div>
        <div class="totals-row">
          <span>Tax Rate (%)</span>
          <input type="number" id="taxRate" value="12" style="width: 70px; text-align: right;" oninput="calculateTotals()" />
        </div>
        <div class="totals-row">
          <span>Tax Amount</span>
          <span id="taxDisplay">₱0.00</span>
        </div>
        <div class="totals-row grand">
          <span>Total Due</span>
          <span id="totalDisplay">₱0.00</span>
        </div>
      </div>
    </div>

    <div class="actions-bar no-print">
      <a href="https://ko-fi.com/handlevault" target="_blank" class="btn btn-kofi">
        ☕ Support on Ko-fi
      </a>
      
      <div class="action-buttons-group">
        <button class="btn btn-secondary" onclick="loadDraft()">Load Draft</button>
        <button class="btn btn-secondary" onclick="saveDraft()">Save Draft</button>
        <button class="btn" onclick="window.print()">Print / Export PDF</button>
      </div>
    </div>
  </div>

  <script>
    let items = [
      { description: "Professional Services / Consulting", qty: 1, price: 12500 }
    ];

    function renderItems() {
      const tbody = document.getElementById('itemsBody');
      tbody.innerHTML = '';
      const curr = document.getElementById('currency').value;

      items.forEach((item, idx) => {
        const tr = document.createElement('tr');

        // Description Cell
        const tdDesc = document.createElement('td');
        const inputDesc = document.createElement('input');
        inputDesc.type = 'text';
        inputDesc.className = 'table-input';
        inputDesc.value = item.description;
        inputDesc.oninput = (e) => { items[idx].description = e.target.value; };
        tdDesc.appendChild(inputDesc);
        tr.appendChild(tdDesc);

        // Qty Cell
        const tdQty = document.createElement('td');
        const inputQty = document.createElement('input');
        inputQty.type = 'number';
        inputQty.className = 'table-input';
        inputQty.value = item.qty;
        inputQty.min = '1';
        inputQty.style.width = '70px';
        inputQty.oninput = (e) => {
          items[idx].qty = parseFloat(e.target.value) || 0;
          updateRowTotal(idx, tr);
          calculateTotals();
        };
        tdQty.appendChild(inputQty);
        tr.appendChild(tdQty);

        // Price Cell
        const tdPrice = document.createElement('td');
        const inputPrice = document.createElement('input');
        inputPrice.type = 'number';
        inputPrice.className = 'table-input';
        inputPrice.value = item.price;
        inputPrice.min = '0';
        inputPrice.oninput = (e) => {
          items[idx].price = parseFloat(e.target.value) || 0;
          updateRowTotal(idx, tr);
          calculateTotals();
        };
        tdPrice.appendChild(inputPrice);
        tr.appendChild(tdPrice);

        // Amount Cell
        const tdAmount = document.createElement('td');
        tdAmount.id = `amount-${idx}`;
        tdAmount.style.fontWeight = '600';
        tdAmount.style.paddingLeft = '10px';
        tdAmount.style.whiteSpace = 'nowrap';
        tdAmount.innerText = `${curr}${(item.qty * item.price).toFixed(2)}`;
        tr.appendChild(tdAmount);

        // Action/Delete Cell
        const tdAction = document.createElement('td');
        tdAction.className = 'no-print';
        tdAction.style.textAlign = 'center';
        const btnDelete = document.createElement('button');
        btnDelete.className = 'btn-danger';
        btnDelete.innerText = '✕';
        btnDelete.onclick = () => removeItem(idx);
        tdAction.appendChild(btnDelete);
        tr.appendChild(tdAction);

        tbody.appendChild(tr);
      });
      calculateTotals();
    }

    function updateRowTotal(idx, tr) {
      const curr = document.getElementById('currency').value;
      const item = items[idx];
      const amountTd = tr.querySelector(`#amount-${idx}`);
      if (amountTd) {
        amountTd.innerText = `${curr}${(item.qty * item.price).toFixed(2)}`;
      }
    }

    function addItem() {
      items.push({ description: "", qty: 1, price: 0 });
      renderItems();
    }

    function removeItem(idx) {
      items.splice(idx, 1);
      renderItems();
    }

    function calculateTotals() {
      const curr = document.getElementById('currency').value;
      const subtotal = items.reduce((sum, item) => sum + (item.qty * item.price || 0), 0);
      const taxRate = parseFloat(document.getElementById('taxRate').value) || 0;
      const tax = subtotal * (taxRate / 100);
      const total = subtotal + tax;

      document.getElementById('subtotalDisplay').innerText = `${curr}${subtotal.toFixed(2)}`;
      document.getElementById('taxDisplay').innerText = `${curr}${tax.toFixed(2)}`;
      document.getElementById('totalDisplay').innerText = `${curr}${total.toFixed(2)}`;
    }

    function saveDraft() {
      const data = {
        invoiceNumber: document.getElementById('invoiceNumber').value,
        issueDate: document.getElementById('issueDate').value,
        dueDate: document.getElementById('dueDate').value,
        currency: document.getElementById('currency').value,
        fromInfo: document.getElementById('fromInfo').value,
        toInfo: document.getElementById('toInfo').value,
        notes: document.getElementById('notes').value,
        taxRate: document.getElementById('taxRate').value,
        items: items
      };
      localStorage.setItem('invoice_pro_v2', JSON.stringify(data));
      alert('Draft saved successfully to browser storage!');
    }

    function loadDraft() {
      const saved = localStorage.getItem('invoice_pro_v2');
      if (saved) {
        const data = JSON.parse(saved);
        document.getElementById('invoiceNumber').value = data.invoiceNumber || 'INV-2026-001';
        document.getElementById('issueDate').value = data.issueDate || '';
        document.getElementById('dueDate').value = data.dueDate || '';
        document.getElementById('currency').value = data.currency || '₱';
        document.getElementById('fromInfo').value = data.fromInfo || '';
        document.getElementById('toInfo').value = data.toInfo || '';
        document.getElementById('notes').value = data.notes || '';
        document.getElementById('taxRate').value = data.taxRate || 12;
        if (data.items && data.items.length) items = data.items;
        renderItems();
        alert('Draft loaded successfully!');
      } else {
        alert('No saved draft found.');
      }
    }

    window.onload = () => {
      const saved = localStorage.getItem('invoice_pro_v2');
      if (saved) {
        loadDraft();
      } else {
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('issueDate').value = today;
        renderItems();
      }
    };
  </script>
</body>
</html>
